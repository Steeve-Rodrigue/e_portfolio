app = 'api-portfolio-backend'
primary_region = 'cdg'

[build]

[deploy]
  release_command = 'uv run python scripts/migrate.py'

[env]
  APP_ENV = 'production'
  APP_PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
