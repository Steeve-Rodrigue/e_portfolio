- slug: "blood-donation-dashboard"
  title: "Blood Donation Campaign Dashboard"
  properties: "Tableau de bord de pilotage de campagne de don de sang avec vérification automatique de l'éligibilité et cartographie des donneurs."
  context:
    - type: text
      content: |
        Le sang est une ressource vitale et non substituable. Pour qu'un don
        soit sûr , pour le donneur comme pour le receveur , chaque candidat
        doit répondre à des critères médicaux stricts : âge, poids, taux
        d'hémoglobine, délai depuis le dernier don, absence de certaines
        maladies.
  problematic:
    - type: text
      content: |
        Chaque année, des milliers de patients ont besoin de transfusions,
        mais les campagnes de don de sang manquent d'outils pour identifier
        rapidement les donneurs éligibles, suivre leur disponibilité et piloter
        l'efficacité des collectes en temps réel."
  methodology:
    - type: text
      content: |
        Automatisation de la vérification médicale par classification des volontaires
        en trois catégories : éligible, temporairement non éligible (don récent,
        grossesse, infection) et définitivement non éligible (VIH, drépanocytose, diabète).
        Les résultats sont centralisés dans un tableau de bord Streamlit avec KPIs en temps réel.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779135991/Capture_d_%C3%A9cran_2026-05-17_235421_qwr74d.png"
    - type: text
      content: |
        Chaque donneur est localisé sur une carte interactive découpée par quartier
        et arrondissement au Cameroun, offrant une vue géographique de la couverture
        des collectes et des zones sous-représentées.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779135992/Capture_d_%C3%A9cran_2026-05-17_235655_exafmx.png"

    - type: text
      content: |
        Les donneurs sont analysés selon plusieurs critères — groupe sanguin, âge,
        genre et statut d'éligibilité — avec des graphiques d'évolution temporelle
        pour suivre la dynamique de la campagne.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779136081/Capture_d_%C3%A9cran_2026-05-18_000107_aqdxrw.png"

    - type: text
      content: |
        Un profil global synthétise les indicateurs clés de chaque donneur.
        Un formulaire d'enregistrement intégré vérifie automatiquement l'éligibilité
        à la soumission. L'interface est multilingue avec plusieurs thèmes visuels.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779135994/Capture_d_%C3%A9cran_2026-05-17_235833_kfybtk.png"
  results_impact: |
    Outil complet de pilotage de campagne couvrant l'ensemble du cycle :
    collecte, vérification médicale, visualisation et cartographie.
    Réduction du temps de vérification manuelle de l'éligibilité grâce
    à l'automatisation des critères médicaux.
  metrics:
