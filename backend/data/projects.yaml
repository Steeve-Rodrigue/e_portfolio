- slug: "sentiment-analysis-api"
  title: "API d'Analyse de Sentiment"
  problem_statement: |
    Construire une API REST prête pour la production qui classifie le sentiment
    d'un texte (positif, négatif, neutre) avec une latence inférieure à 100ms.
  methodology: |
    Fine-tuning d'un modèle DistilBERT sur le dataset SST-2.
    Servi via FastAPI avec mise en cache du modèle et inférence par batch.
  results_impact: |
    92% de précision sur le jeu de test avec une latence moyenne de 45ms.
  metrics:
    accuracy: 0.92
    latency_ms: 45
  tech_stack:
    - Python
    - FastAPI
    - HuggingFace Transformers
    - Docker
  categories:
    - NLP
