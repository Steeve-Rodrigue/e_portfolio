- slug: "mlops-pipeline"
  title: "Pipeline MLOps de Bout en Bout"
  problem_statement: |
    Construire un pipeline ML entièrement automatisé gérant l'ingestion
    des données, l'entraînement, l'évaluation, le versioning et le déploiement
