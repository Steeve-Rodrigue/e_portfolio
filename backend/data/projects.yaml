- slug: "fueltrack"
  title: "FuelTrack — Suivi des Prix des Carburants"
  properties: "Application de suivi des prix carburants couvrant 11 000+ stations françaises avec carte interactive et comparaison des prix."
  context:
    - type: text
      content: |
        Le prix du carburant varie chaque jour et d'une station à l'autre.
        Pourtant, la plupart des automobilistes choisissent leur station par
        habitude, sans savoir si une moins chère existe à proximité.
  problematic:
    - type: text
      content: |
        FuelTrack centralise les prix de 11 000+ stations françaises pour
        aider à faire le bon choix au bon moment — avec une visualisation
        de l'évolution des prix et un classement des stations les moins chères.
  methodology:
    - type: text
      content: |
        Les données de prix sont issues de l'API officielle du gouvernement
        français, téléchargées au format XML puis parsées et stockées dans
        une base PostgreSQL. Cette collecte peut être relancée quotidiennement
        pour maintenir les prix à jour.

        Une API FastAPI expose les données et gère l'authentification des
        utilisateurs via JWT. Une interface Streamlit permet d'explorer
        ces données sans aucune connaissance technique : visualisation de
        l'évolution des prix sur une période, comparaison entre carburants,
        classement des stations les moins chères par localisation, et
        carte interactive avec les stations à proximité.

        Un système de rôles (utilisateur / administrateur) permet de gérer
        les accès et de superviser les comptes depuis un tableau de bord dédié.
  results_impact: |
    Application complète et fonctionnelle couvrant 11 000+ stations françaises.
    Visualisation des tendances de prix sur plusieurs mois.
    Identification des stations les moins chères avec estimation de l'économie
    réalisée sur un plein de 50 litres.
  metrics:
    stations_couvertes: "11 000+"
    tables_base_de_donnees: 9
    comptes_de_test: 7
  tech_stack:
    - Python
    - FastAPI
    - Streamlit
    - PostgreSQL
    - JWT
    - Folium
  categories:
    - Data Engineering
    - Full Stack
  github_url: ""
