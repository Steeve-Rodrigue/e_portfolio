- slug: "ot-scomics"
  title: "Optimal Transport for Single-Cell Omics"
  properties: "Comparaison de l'Optimal Transport et de la distance euclidienne comme métriques de similarité cellulaire pour le clustering single-cell."
  context:
    - type: text
      content: |
        Les cellules humaines produisent des milliers de protéines en quantités
        variables — c'est ce qu'on appelle l'expression génique. Mesurer ces
        quantités pour chaque cellule génère un profil unique, comparable à une
        empreinte digitale biologique.

        Pour regrouper automatiquement ces cellules par type, il faut d'abord
        définir ce que signifie "être similaire". La méthode classique utilise
        la distance euclidienne — la ligne droite entre deux points — appliquée
        directement sur ces profils d'expression.
  problematic:
    - type: text
      content: |
        Le corps humain contient des milliards de cellules, chacune avec un
        profil d'expression génique unique. Pour comprendre des maladies ou
        évaluer des traitements, les biologistes ont besoin de regrouper
        automatiquement ces cellules par type — sans les avoir étiquetées
        au préalable.

        Les méthodes classiques mesurent la similarité entre cellules de
        façon simpliste, ce qui peut conduire à des regroupements incorrects
        et fausser l'interprétation biologique. Ce projet explore si une
        mesure plus sophistiquée de la similarité améliore la qualité de
        ce regroupement automatique.
  methodology:
    - type: text
      content: |
        Ce projet explore une alternative : l'Optimal Transport (OT), une
        technique mathématique qui mesure l'effort minimal pour transformer
        la distribution d'expression d'une cellule en celle d'une autre.
        Intuitivement, c'est comme mesurer le coût de déplacer de la terre
        d'un tas vers un autre — on tient compte de la forme globale des
        distributions, pas seulement de leurs valeurs ponctuelles.

        Les deux métriques sont comparées sur leur capacité à produire des
        groupes de cellules biologiquement cohérents, via des algorithmes
        de clustering hiérarchique et Leiden. La qualité des regroupements
        est évaluée par des scores standardisés (ARI, NMI, silhouette).
        Plusieurs méthodes de visualisation en 2D (MDS, Isomap, GW-MDS)
        permettent enfin de rendre les résultats interprétables visuellement.
  results_impact: |
    Meilleure séparation des types cellulaires avec la distance OT
    comparée à la distance euclidienne classique, confirmée par
    plusieurs métriques de clustering indépendantes.
    Comparaison systématique de 4 méthodes de visualisation
    dimensionnelle appliquées aux matrices de distance OT.
  metrics:
    methodes_comparees: 4
    algorithmes_clustering: 3
  tech_stack:
    - Python
    - PyTorch
    - NumPy
    - Scanpy
    - scikit-learn
    - otscomics
    - Plotly
  categories:
    - Bioinformatique
    - Machine Learning
  github_url: "https://github.com/ComputationalSystemsBiology/OT-scOmics"
