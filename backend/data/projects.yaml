- slug: "ot-scomics"
  title: "Optimal Transport for Single-Cell Omics"
  properties: "Comparaison de l'Optimal Transport et de la distance euclidienne comme métriques de similarité cellulaire pour le clustering single-cell."
  context:
    - type: text
      content: |
        Chaque cellule humaine produit des milliers de protéines en quantités
        variables — c'est l'expression génique. Analyser ces profils permet
        d'identifier automatiquement les types cellulaires, une étape clé
        pour comprendre les maladies et développer de nouveaux traitements.

        La qualité de ce regroupement dépend entièrement de la métrique
        utilisée pour mesurer la similarité entre cellules — et la méthode
        classique, la distance euclidienne, montre ses limites face à la
        complexité des données biologiques.
  problematic:
    - type: text
      content: |
        Les méthodes classiques mesurent la similarité entre cellules de
        façon simpliste, ce qui peut conduire à des regroupements incorrects
        et fausser l'interprétation biologique. Ce projet explore si une
        mesure plus sophistiquée de la similarité améliore la qualité de
        ce regroupement automatique.
  methodology:
  - type: text
    content: |
      Ce projet explore l'Optimal Transport (OT), une technique mathématique
      qui mesure l'effort minimal pour transformer la distribution d'expression
      d'une cellule en celle d'une autre — comme déplacer de la terre d'un tas
      vers un autre en tenant compte de la forme globale des distributions.

  - type: text
    content: |
      Les deux métriques (OT et distance euclidienne) sont comparées sur leur
      capacité à produire des groupes de cellules biologiquement cohérents,
      via des algorithmes de clustering hiérarchique et Leiden. La qualité
      des regroupements est évaluée par des scores standardisés en particulier le
      silhouette.

  - type: text
    content: |
      Plusieurs méthodes de visualisation 2D (MDS, Isomap, GW-MDS) permettent
      de rendre les résultats interprétables visuellement. La comparaison
      des clusters obtenus avec chaque métrique montre que l'OT capture mieux
      la structure biologique sous-jacente

  - type: image
    url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779142436/cluster_ouiabg.png"
  results_impact: |
    Meilleure séparation des types cellulaires avec la distance OT
    comparée à la distance euclidienne classique, confirmée par
    le score de silhouette qui mesure la qualité du clustering.
  metrics:
    silhouette_score_with_optimal_transport: "0.83"
    silhouette_score_with_euclidean: "0.31"
  tech_stack:
    - Python
    - PyTorch
    - NumPy
    - Scanpy
    - scikit-learn
    - otscomics
    - Plotly
  categories:
    - Bioinformatique
    - Machine Learning
  github_url: "https://github.com/Steeve-Rodrigue/optimal_transport"
  demo_url: ""
  featured: false
  thumbnail_url: ""
  display_order: 2


- slug: "fueltrack"
  title: "FuelTrack — Suivi des Prix des Carburants"
  properties: "Application de suivi des prix carburants couvrant 11 000+ stations françaises avec carte interactive et comparaison des prix."
  context:
    - type: text
      content: |
        Le prix du carburant varie chaque jour et d'une station à l'autre.
        Pourtant, la plupart des automobilistes choisissent leur station par
        habitude, sans savoir si une moins chère existe à proximité.
  problematic:
    - type: text
      content: |
        Faute d'outil adapté, la plupart des
        automobilistes choisissent leur station par habitude et paient plus
        cher sans le savoir.
  methodology:
    - type: text
      content: |
        FuelTrack répond à ce problème en centralisant les données de
        11 000+ stations françaises en un seul endroit.

        Classement des stations les moins chères sur l'ensemble du territoire
        national ou filtré par commune — pour identifier d'un coup d'œil
        où faire le plein au meilleur prix.
    - type: image
      url: ""
    - type: text
      content: |
        Visualisation de l'évolution des prix d'un carburant sur une période
        définie — pour comprendre les tendances, anticiper les hausses
        et choisir le bon moment pour faire le plein.a
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779139907/courbe_nswihs.png"

    - type: text
      content: |
        Détection automatique des stations les plus proches en fonction
        de la position de l'utilisateur — avec les prix en temps réel
        pour un choix rapide et éclairé.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779139849/Capture_d_%C3%A9cran_2026-05-18_231550_gp4olo.png"

  results_impact: |
    Application complète et fonctionnelle couvrant 11 000+ stations françaises.
    Visualisation des tendances de prix sur plusieurs mois.
    Identification des stations les moins chères avec estimation de l'économie
    réalisée sur un plein de 50 litres.
  metrics:
    stations_couvertes: "11 000+"
  tech_stack:
    - Python
    - FastAPI
    - Streamlit
    - PostgreSQL
    - JWT
    - Folium
