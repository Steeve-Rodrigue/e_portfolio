  display_order: 3


- slug: "blood-donation-dashboard"
  title: "Blood Donation Campaign Dashboard"
  properties: "Tableau de bord de pilotage de campagne de don de sang avec vérification automatique de l'éligibilité et cartographie des donneurs."
  context:
    - type: text
      content: |
        Le sang est une ressource vitale et non substituable. Pour qu'un don
        soit sûr — pour le donneur comme pour le receveur — chaque candidat
        doit répondre à des critères médicaux stricts : âge, poids, taux
        d'hémoglobine, délai depuis le dernier don, absence de certaines
        maladies.
  problematic:
    - type: text
      content: |
        Organiser une campagne de don de sang, c'est gérer des centaines
        de volontaires avec des profils médicaux variés, sans outil adapté
        pour suivre leur éligibilité, leur localisation et l'évolution
        de la campagne en temps réel. Ce tableau de bord centralise toutes
        ces informations pour aider les responsables à prendre de meilleures
        décisions.
  methodology:
    - type: text
      content: |
        Ce projet automatise la vérification médicale en analysant les données
        collectées auprès des volontaires. Chaque profil est classé en trois
        catégories : éligible, temporairement non éligible (ex. don récent,
        grossesse, infection), ou définitivement non éligible (ex. VIH,
        drépanocytose, diabète).

        Les résultats sont visualisés dans un tableau de bord interactif
        construit avec Streamlit, offrant des KPIs en temps réel, des
        graphiques d'évolution temporelle, une carte interactive des
        donneurs par quartier et arrondissement au Cameroun, ainsi qu'un
        formulaire d'enregistrement de nouveaux volontaires avec vérification
        automatique de leur éligibilité. L'interface est disponible en
        plusieurs langues et propose plusieurs thèmes visuels.
  results_impact: |
    Outil complet de pilotage de campagne couvrant l'ensemble du cycle :
    collecte, vérification médicale, visualisation et cartographie.
    Réduction du temps de vérification manuelle de l'éligibilité grâce
    à l'automatisation des critères médicaux.
  metrics:
    sections_dashboard: 7
    criteres_eligibilite: 10
    visualisations: "KPI, cartes, heatmaps, radar, wordcloud"
  tech_stack:
    - Python
    - Streamlit
    - Pandas
    - Plotly
    - Folium
    - GeoPandas
    - PostgreSQL
  categories:
    - Data Visualisation
    - Santé Publique
