- slug: "churn-prediction"
  title: "Prédiction du Taux d'Attrition Client"
  problem_statement: |
    Prédire quels clients télécom sont susceptibles de se désabonner
    dans les 30 prochains jours pour des campagnes de rétention proactives.
  methodology: |
    Entraînement d'un classifieur XGBoost sur 3 ans de données comportementales.
    Feature engineering incluant des variables de récence, fréquence et montant.
  results_impact: |
    Réduction du taux d'attrition de 18% en test A/B.
    Modèle déployé en batch hebdomadaire.
  metrics:
    auc_roc: 0.89
    precision: 0.81
    recall: 0.76
