- slug: "sentiment-analysis-api"
  title: "Sentiment Analysis API"
  problem_statement: |
    Build a production-ready REST API that classifies the sentiment of text
    (positive, negative, neutral) with sub-100ms latency.
  methodology: |
    Fine-tuned a DistilBERT model on the SST-2 dataset.
    Served via FastAPI with model caching and batch inference support.
  results_impact: |
    Achieved 92% accuracy on the test set with an average latency of 45ms.
  metrics:
    accuracy: 0.92
    latency_ms: 45
  tech_stack:
    - Python
    - FastAPI
    - HuggingFace Transformers
    - Docker
  categories:
    - NLP
