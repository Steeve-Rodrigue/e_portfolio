- slug: "recommendation-system"
  title: "Système de Recommandation E-Commerce"
  problem_statement: |
    Augmenter le panier moyen d'une plateforme e-commerce en recommandant
    des produits pertinents aux utilisateurs en temps réel.
  methodology: |
    Recommandeur hybride combinant du filtrage collaboratif (factorisation
    matricielle ALS) et un ranker XGBoost basé sur le contenu.
    Servi via une API Redis à faible latence.
  results_impact: |
    Taux de clic amélioré de 34% et panier moyen de 12%.
    500K utilisateurs actifs quotidiens avec une latence p99 inférieure à 20ms.
