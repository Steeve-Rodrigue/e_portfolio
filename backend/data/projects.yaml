- slug: "clinical-trial-analysis"
  title: "Analyse Statistique d'Essai Clinique"
  problem_statement: |
    Analyser les données d'un essai contrôlé randomisé pour évaluer
    l'efficacité d'un nouveau médicament sur le temps de rétablissement.
  methodology: |
    Analyse de survie (Kaplan-Meier, régression de Cox) et modèles
    à effets mixtes. Ajustement des facteurs confondants via score
    de propension. Reproductibilité complète via R Markdown.
  results_impact: |
    Réduction statistiquement significative du temps de rétablissement
    de 3.2 jours (p < 0.001). Résultats publiés dans une revue à comité de lecture.
  metrics:
    p_value: 0.001
    recovery_reduction_days: 3.2
    effect_size: 0.42
  tech_stack:
