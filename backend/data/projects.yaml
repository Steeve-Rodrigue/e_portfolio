- slug: "llm-document-qa"
  title: "Système Q&R sur Documents via LLM"
  problem_statement: |
    Permettre à des utilisateurs non techniques d'interroger de grands
    documents PDF internes en langage naturel sans recherche manuelle.
  methodology: |
    Pipeline RAG construit avec LangChain, un vector store FAISS
    et un modèle Mistral-7B fine-tuné comme générateur.
    Documents découpés et embarqués avec sentence-transformers.
  results_impact: |
    Réduction du temps de recherche documentaire de 70%.
    Déployé pour une équipe de 50 analystes avec 89% de satisfaction.
  metrics:
    answer_relevance: 0.89
    retrieval_accuracy: 0.91
