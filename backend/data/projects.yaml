- slug: "energy-consumption-forecast"
  title: "Prévision de Consommation Énergétique"
  problem_statement: |
    Prévoir la consommation horaire d'électricité pour un opérateur
    de réseau régional afin d'optimiser les achats et réduire les coûts.
  methodology: |
    Combinaison d'un modèle Prophet comme baseline et d'un LSTM
    pour la correction des résidus. Variables externes incluant météo,
    jours fériés et indicateurs économiques.
  results_impact: |
    MAPE de 2.3% sur des prévisions à 48 heures.
    Économies annuelles estimées à 1.2M€ sur les achats d'énergie.
