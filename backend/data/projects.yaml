- slug: "real-time-fraud-detection"
  title: "Détection de Fraude en Temps Réel"
  problem_statement: |
    Détecter les transactions frauduleuses par carte bancaire en temps réel
    avec un minimum de faux positifs pour ne pas bloquer les utilisateurs légitimes.
  methodology: |
    Modèle ensemble combinant Isolation Forest et LightGBM.
    Déployé sur un flux Kafka avec une inférence inférieure à 50ms par transaction.
  results_impact: |
    94% des fraudes détectées avec un taux de faux positifs inférieur à 0.3%.
    Traitement de 10 000 transactions par seconde en production.
  metrics:
    recall: 0.94
    false_positive_rate: 0.003
    latency_ms: 38
  tech_stack:
