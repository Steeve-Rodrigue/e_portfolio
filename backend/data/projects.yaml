- slug: "jobpilot"
  title: "JobPilot — Application de Recherche d'Emploi"
  properties: "Application full stack centralisant les offres data/IA de France Travail avec recherche multi-critères et gestion de profil."
  context:
    - type: text
      content: |
        Le marché de l'emploi data/IA est en pleine expansion, mais les offres
        sont dispersées sur des dizaines de plateformes différentes — rendant
        la veille fastidieuse et chronophage pour les candidats.
  problematic:
    - type: text
      content: |
        Les chercheurs d'emploi dans le domaine data/IA perdent un temps
        considérable à parcourir manuellement des centaines d'offres dispersées,
        sans outil centralisé pour gérer leur profil et suivre leurs candidatures.
  methodology:
    - type: text
      content: |
        JobPilot répond à ce problème en agrégeant automatiquement les offres
        France Travail au démarrage — accessibles depuis une interface unique
        avec authentification sécurisée.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1778767907/Capture_d_%C3%A9cran_du_2026-05-14_16-10-27_plwlud.png"
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1778767906/Capture_d_%C3%A9cran_du_2026-05-14_16-10-40_wynxq1.png"
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1778767906/Capture_d_%C3%A9cran_du_2026-05-14_16-10-52_jyv9p6.png"

    - type: text
      content: |

        Les offres sont explorables et filtrables par métier, localisation
        et type de contrat — pour accéder rapidement aux opportunités
        les plus pertinentes.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1778791778/Capture_d_%C3%A9cran_du_2026-05-14_22-44-21_zw5dkz.png"

    - type: text
      content: |

        Chaque offre dispose d'une page détaillée avec toutes les informations
        clés — description du poste, compétences requises, localisation
        et modalités de candidature.
    - type: image
      url: "https://res.cloudinary.com/dp9qlaych/image/upload/v1779028449/Capture_d_%C3%A9cran_du_2026-05-17_16-26-51_grihyb.png"

    - type: text
      content: |

        Un profil utilisateur personnalisable permet de centraliser ses
